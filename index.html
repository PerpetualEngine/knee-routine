<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knee routine</title>
<meta name="theme-color" content="#1D9E75">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --text-primary:#1f2328;
  --text-secondary:#5c6670;
  --surface-1:#f3f5f4;
  --page-bg:#ffffff;
  --border-strong:#b9c1c7;
  --border-accent:#1D9E75;
  --bg-accent:#e1f5ee;
  --text-accent:#0b6b4d;
}
@media (prefers-color-scheme: dark){
  :root{
    --text-primary:#eceff1;
    --text-secondary:#9aa5ad;
    --surface-1:#22272b;
    --page-bg:#14181b;
    --border-strong:#4a545b;
    --border-accent:#2fc79a;
    --bg-accent:#12332a;
    --text-accent:#5fe0b8;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--page-bg);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
main{max-width:420px;margin:0 auto;padding:16px 16px 32px;}
h1{font-size:18px;font-weight:600;margin:0 0 12px;}
button{font:inherit;color:var(--text-primary);background:var(--surface-1);border:1px solid var(--border-strong);border-radius:8px;padding:10px;cursor:pointer;}
button:active{transform:scale(.98)}
.disclaimer{font-size:12px;color:var(--text-secondary);line-height:1.5;margin:20px 0 0;border-top:1px solid var(--border-strong);padding-top:12px;}
</style>
</head>
<body>
<main>
<h1>Knee routine</h1>
<div id="lists"></div>
<div style="background:var(--surface-1);border-radius:12px;padding:8px 0;margin-top:4px;">
<svg width="100%" viewBox="0 0 380 200" role="img"><title>Exercise demonstration</title><desc>A stick figure performing the selected exercise or stretch on a loop</desc>
<line x1="20" y1="176" x2="360" y2="176" stroke="var(--border-strong)" stroke-width="1"/>
<g id="fig"></g>
</svg>
</div>
<div style="display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 4px;">
<span id="name" style="font-size:16px;font-weight:500;"></span>
<span id="rep" style="font-size:13px;color:var(--text-secondary);"></span>
</div>
<p id="dose" style="font-size:15px;font-weight:500;margin:0 0 2px;color:var(--text-accent);"></p>
<p id="extra" style="font-size:13px;color:var(--text-secondary);margin:0 0 6px;"></p>
<p id="cue" style="font-size:14px;color:var(--text-secondary);margin:0 0 12px;line-height:1.5;"></p>
<div style="display:flex;gap:8px;">
<button id="prev" aria-label="Previous exercise" style="flex:1">&larr;</button>
<button id="pp" aria-label="Pause or play" style="flex:2">&#10074;&#10074; Pause</button>
<button id="next" aria-label="Next exercise" style="flex:1">&rarr;</button>
</div>
<p class="disclaimer">This is a general routine, not a replacement for your physio's guidance. Keep pain at 3/10 or below. Stop if pain exceeds 3/10 or if swelling, locking or giving way appears. No deep squats until the physio says so.</p>
</main>
<script>
var T="var(--text-primary)",G="#1D9E75",D=Math.PI/180;
function ik(A,B,l1,l2,s){var dx=B[0]-A[0],dy=B[1]-A[1],d=Math.min(Math.hypot(dx,dy),l1+l2-0.01),a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(l1*l1-a*a,0)),ux=dx/d,uy=dy/d,mx=A[0]+ux*a,my=A[1]+uy*a;return [mx-s*uy*h,my+s*ux*h];}
var ST="gentle pull, stop before any sharp pain";
var ex=[
{n:"Straight leg raise",sec:"Strength, 3 to 4 days a week",p:"2 sets × 10 reps, each leg",x:"Hold 2 s at the top. Rest 30 s between sets.",c:"Tighten your thigh, lift to the height of the other knee, lower slowly.",t:[2,2,2],R:10,lab:"Rep",f:function(p){var H=[170,160],S=[82,160],a=35*p*D,E=[H[0]+82*Math.cos(a),H[1]-82*Math.sin(a)],F=[232,160],K=ik(H,F,40,40,-1);return{head:[64,157],rest:[[S,H],[H,K,F]],work:[[H,E]]};}},
{n:"Glute bridge",p:"2 sets × 10 reps",x:"Hold 2 s at the top. Rest 30 s between sets.",c:"Press through your heels, lift until shoulders, hips and knees line up.",t:[2,2,2],R:10,lab:"Rep",f:function(p){var S=[72,160],th=26*p*D,H=[S[0]+95*Math.cos(th),S[1]-95*Math.sin(th)],F=[232,160],K=ik(H,F,52,52,-1);return{head:[56,157],rest:[[S,H]],work:[[H,K,F]]};}},
{n:"Standing side leg lift",p:"2 sets × 10 reps, each leg",x:"Hold 1 s at the top. Rest 30 s between sets.",c:"Stay tall, lift the leg out to the side without leaning.",t:[2,1,2],R:10,lab:"Rep",f:function(p){var a=32*p*D,H=[190,112];return{head:[190,44],circ:10,rest:[[[190,62],H],[H,[186,172]],[[190,68],[172,96],[171,118]],[[190,68],[208,96],[209,118]]],work:[[H,[190+60*Math.sin(a),112+60*Math.cos(a)]]]};}},
{n:"Clamshell",p:"2 sets × 12 reps, each side",x:"Slow and controlled. Rest 30 s between sets.",c:"Lie on your side, knees bent, feet together. Open the top knee, keep hips still.",t:[2,1,2],R:12,lab:"Rep",f:function(p){var S=[72,158],H=[150,158],K1=[205,166],F=[165,172],K2=[205,164-34*p];return{head:[54,156],rest:[[S,H],[H,K1,F]],work:[[H,K2,F]]};}},
{n:"Mini squat",p:"2 sets × 8 to 10 reps",x:"Only down to a 30 to 40 degree bend. Rest 45 s.",c:"Sit back, knees over toes, stay in the pain-free range.",t:[2,1,2],R:10,lab:"Rep",f:function(p){var F=[200,172],H=[200-30*p,70+24*p],K=ik(H,F,52,50,-1),S=[H[0]+12*p,H[1]-48];return{head:[S[0]+3,S[1]-13],circ:10,rest:[[S,H],[S,[S[0]+32,S[1]+8]],[F,[F[0]+16,F[1]]]],work:[[H,K,F]]};}},
{n:"Calf raise",p:"2 sets × 12 to 15 reps",x:"2 s up, 2 s down. Rest 30 s between sets.",c:"Rise onto your toes slowly, lower with control. Use a wall for balance.",t:[1.5,1,1.5],R:15,lab:"Rep",f:function(p){var u=14*p,A=[196,160-u],K=[196,124-u],H=[196,88-u],S=[196,50-u],hl=[186,172-22*p],to=[214,172];return{head:[196,34-u],circ:9,rest:[[S,H],[H,K]],work:[[K,A,hl],[hl,to]]};}},
{n:"Quad stretch",sec:"Stretches, every day",p:"2 holds × 30 s, each leg",x:ST+".",c:"Stand tall, pull your heel toward your glute, knees close together.",t:[2,4,2],R:2,lab:"Hold",f:function(p){var H=[200,84],K=[196,128],ph=150*p*D,F=[K[0]-44*Math.sin(ph),K[1]+44*Math.cos(ph)],S=[200,38],hand=[200+(F[0]-200)*p,100+(F[1]-100)*p],E=ik(S,hand,32,32,1);return{head:[200,22],circ:9,rest:[[S,H],[H,[200,172]],[S,E,hand],[K,F]],work:[[H,K]]};}},
{n:"Hamstring stretch",p:"2 holds × 30 s, each leg",x:ST+".",c:"Lie on your back, loop a towel around the foot, lift the straight leg.",t:[2,4,2],R:2,lab:"Hold",f:function(p){var S=[82,160],H=[170,160],a=75*p*D,E=[H[0]+85*Math.cos(a),H[1]-85*Math.sin(a)],hd=[125,128];return{head:[64,157],rest:[[S,H],[H,[255,160]],[S,hd],[E,hd]],work:[[H,E]]};}},
{n:"Calf stretch at wall",p:"2 holds × 30 s, each leg",x:"Back heel stays flat. "+ST+".",c:"Hands on a wall, back leg straight, lean your hips toward the wall.",t:[2,4,2],R:2,lab:"Hold",f:function(p){var th=(20+10*p)*D,Fb=[120,172],Ff=[200,172],H=[Fb[0]+100*Math.sin(th),Fb[1]-100*Math.cos(th)],S=[H[0]+46*Math.sin(th),H[1]-46*Math.cos(th)],hd=[246,56],E=ik(S,hd,34,34,1),K=ik(H,Ff,52,50,-1);return{head:[S[0]+14*Math.sin(th),S[1]-14*Math.cos(th)],circ:8,wall:[[[252,20],[252,176]]],rest:[[S,H],[S,E,hd],[H,K,Ff],[Ff,[216,172]],[Fb,[136,172]]],work:[[H,Fb]]};}},
{n:"Hip flexor stretch",p:"2 holds × 30 s, each side",x:"Cushion under the back knee. "+ST+".",c:"Half-kneeling, tuck your tailbone, ease the hip forward.",t:[2,4,2],R:2,lab:"Hold",f:function(p){var Kb=[120,172],b=28*p*D,H=[Kb[0]+52*Math.sin(b),Kb[1]-52*Math.cos(b)],Ff=[190,172],Kf=ik(H,Ff,52,50,-1),S=[H[0],H[1]-48];return{head:[S[0]+2,S[1]-13],circ:10,rest:[[Kb,[68,172]],[S,H],[S,[S[0]+10,S[1]+24]],[H,Kf,Ff],[Ff,[206,172]]],work:[[Kb,H]]};}},
{n:"Knee to chest",p:"2 holds × 30 s, each leg",x:ST+".",c:"Lie on your back, hug one knee toward your chest, other leg stays flat.",t:[2,4,2],R:2,lab:"Hold",f:function(p){var S=[100,160],H=[170,160],a=120*p*D,K=[H[0]+50*Math.cos(a),H[1]-50*Math.sin(a)],b=25*p*D,F=[K[0]+50*Math.cos(b),K[1]+50*Math.sin(b)],hand=[100+55*p,160-35*p];return{head:[82,157],rest:[[S,H],[H,[255,160]],[S,hand]],work:[[H,K,F]]};}}
];
var cur=0,t0=performance.now(),off=0,paused=false,btns=[],lists=document.getElementById("lists");
var grid=null;
ex.forEach(function(e,i){if(e.sec){var h=document.createElement("p");h.textContent=e.sec;h.style.cssText="font-size:13px;color:var(--text-secondary);margin:"+(i?"12px":"0")+" 0 6px;";lists.appendChild(h);grid=document.createElement("div");grid.style.cssText="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;";lists.appendChild(grid);}
var b=document.createElement("button");b.textContent=(i+1)+". "+e.n;b.style.cssText="font-size:13px;padding:8px 6px;text-align:left;";b.onclick=function(){setEx(i);};grid.appendChild(b);btns.push(b);});
function pts(l){return l.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join(" ");}
function pl(l,col,w){return '<polyline points="'+pts(l)+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>';}
function ss(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
function setEx(i){cur=(i+ex.length)%ex.length;off=0;t0=performance.now();var e=ex[cur];document.getElementById("name").textContent=e.n;document.getElementById("cue").textContent=e.c;document.getElementById("dose").textContent=e.p;document.getElementById("extra").textContent=e.x;btns.forEach(function(b,j){var on=j===cur;b.style.borderColor=on?"var(--border-accent)":"";b.style.background=on?"var(--bg-accent)":"";b.style.color=on?"var(--text-accent)":"";});}
document.getElementById("prev").onclick=function(){setEx(cur-1);};
document.getElementById("next").onclick=function(){setEx(cur+1);};
var pp=document.getElementById("pp");
pp.onclick=function(){if(paused){paused=false;t0=performance.now()-off;pp.innerHTML='&#10074;&#10074; Pause';}else{paused=true;pp.innerHTML='&#9654; Play';}};
var fig=document.getElementById("fig");
function frame(now){if(!paused)off=now-t0;var e=ex[cur],tm=e.t,cy=tm[0]+tm[1]+tm[2],s=(off/1000)%cy,p;if(s<tm[0])p=ss(s/tm[0]);else if(s<tm[0]+tm[1])p=1;else p=1-ss((s-tm[0]-tm[1])/tm[2]);
var o=e.f(p),h="";(o.wall||[]).forEach(function(l){h+=pl(l,"var(--border-strong)",3);});
h+='<circle cx="'+o.head[0].toFixed(1)+'" cy="'+o.head[1].toFixed(1)+'" r="'+(o.circ||9)+'" fill="none" stroke="'+T+'" stroke-width="4"/>';
o.rest.forEach(function(l){h+=pl(l,T,5);});o.work.forEach(function(l){h+=pl(l,G,5);});fig.innerHTML=h;
document.getElementById("rep").textContent=e.lab+" "+(Math.floor(off/1000/cy)%e.R+1)+" of "+e.R;requestAnimationFrame(frame);}
setEx(0);requestAnimationFrame(frame);
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}
</script>
</body>
</html>
